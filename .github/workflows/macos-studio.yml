name: Build Lecture Studio for macOS
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft GitHub release after successful builds
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ANNIE_DATA_DIR: ${{ github.workspace }}/.test-profile
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements-macos.txt
      - name: Stage only shareable Studio files
        run: python -c "from pathlib import Path; from tools.build_studio_macos import stage_macos; stage_macos(Path('clean-studio'))"
      - name: Run Studio tests in a clean profile
        working-directory: clean-studio
        run: python -m unittest discover -s tests -v
      - name: Cache public transcription model for offline smoke test
        run: python -c "from faster_whisper.utils import download_model; download_model('base', output_dir='native-test-model')"
      - name: Compile native audio, build both executables and test generated speech
        working-directory: clean-studio
        run: python tools/build_studio_macos.py --ci --smoke-model ../native-test-model
      - uses: actions/upload-artifact@v4
        with:
          name: LectureStudio-${{ matrix.runner }}-unnotarized
          path: clean-studio/releases/*
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: ${{ inputs.create_draft }}
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: LectureStudio-*-unnotarized
          path: installers
          merge-multiple: true
      - name: Create versioned draft with notes and installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c "from annie.version import VERSION; print(VERSION)")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release create "v$version" installers/* \
            --draft --target "$GITHUB_SHA" --title "Lecture Studio $version" \
            --notes-file packaging/RELEASE_NOTES.md
